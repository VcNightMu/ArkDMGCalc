<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArkDMGCalc - 明日方舟干员输出计算器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>⚔️ ArkDMGCalc</h1>
    <p class="subtitle">明日方舟干员输出计算器</p>
  </header>

  <main class="app-main">
    <!-- 敌人数据面板 -->
    <section class="panel enemy-panel">
      <h2>🎯 敌人数据</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>生命值 (HP)</label>
          <input type="number" id="enemy-hp" value="50000" min="0">
        </div>
        <div class="form-group">
          <label>攻击力 (ATK)</label>
          <input type="number" id="enemy-atk" value="800" min="0">
        </div>
        <div class="form-group">
          <label>防御力 (DEF)</label>
          <input type="number" id="enemy-def" value="600" min="0">
        </div>
        <div class="form-group">
          <label>法术抗性 (RES%)</label>
          <input type="number" id="enemy-res" value="50" min="0" max="100">
        </div>
        <div class="form-group">
          <label>敌人类型</label>
          <select id="enemy-grade">
            <option value="normal" selected>普通</option>
            <option value="elite">精英</option>
            <option value="leader">领袖</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 干员选择区域 -->
    <section class="panel operator-panel">
      <h2>👤 干员配置</h2>
      <div class="operator-slots" id="operator-slots">
        <!-- 最多4个干员槽位 -->
      </div>
    </section>

    <!-- 干员基础属性 -->
    <section class="panel stats-panel">
      <h2>📋 基础属性</h2>
      <div class="panel-stats" id="panel-stats">
        <p class="placeholder-text">选择干员后显示基础属性</p>
      </div>
    </section>

    <!-- 计算结果 -->
    <section class="panel result-panel">
      <h2>📊 计算结果</h2>
      <div class="result-comparison" id="result-comparison">
        <p class="placeholder-text">选择干员后显示计算结果</p>
      </div>
    </section>

    <!-- 干员说明 -->
    <section class="panel notes-panel">
      <h2>📝 说明</h2>
      <div class="notes-list" id="notes-list">
        <p class="placeholder-text">选择干员后显示说明</p>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
